[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reversi-bot-mvp"
version = "0.5.0"
description = "WePlay Reversi instant-response monitor with per-case pondering and pass finisher"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10.0"]
live = ["Pillow>=10.0", "numpy>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
reversi-bot = "reversi_bot.cli:main"
reversi-monitor = "reversi_bot.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
